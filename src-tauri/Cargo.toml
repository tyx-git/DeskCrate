[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
fs2 = "0.4"
log = "0.4"
tauri = { version = "2.11.3", default-features = false, features = ["wry", "protocol-asset"] }
tauri-plugin-log = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }
lnk = "0.3"
image = { version = "0.25", features = ["png", "ico"] }

[dev-dependencies]
tauri = { version = "2.11.3", default-features = false, features = ["test", "wry"] }
